[workspace]
resolver = "3"
members = [
    "crates/vivivi-core",
    "crates/vivivi-vi",
    "crates/vivivi-modes",
    "crates/vivivi-app",
    "crates/vivivi-gui",
]

[workspace.package]
version = "0.9.7-beta"
edition = "2024"
authors = ["vivivi developers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tkshnkgwr/vivivi"

[workspace.dependencies]
vivivi-core = { path = "crates/vivivi-core" }
vivivi-vi = { path = "crates/vivivi-vi" }
vivivi-modes = { path = "crates/vivivi-modes" }
vivivi-app = { path = "crates/vivivi-app" }

thiserror = "2.0"
anyhow = "1.0"
unicode-width = "0.2"
encoding_rs = "0.8"
regex = "1.11"
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
