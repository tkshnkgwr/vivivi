[workspace]
resolver = "3"
members = [
    "crates/vivivi-core",
    "crates/vivivi-vi",
    "crates/vivivi-modes",
    "crates/vivivi-app",
    "crates/vivivi-gui",
]

[workspace.package]
version = "0.9.10-beta"
edition = "2024"
authors = ["vivivi developers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tkshnkgwr/vivivi"

[workspace.dependencies]
vivivi-core = { path = "crates/vivivi-core" }
vivivi-vi = { path = "crates/vivivi-vi" }
vivivi-modes = { path = "crates/vivivi-modes" }
vivivi-app = { path = "crates/vivivi-app" }

thiserror = "2.0"
anyhow = "1.0"
unicode-width = "0.2"
encoding_rs = "0.8"
regex = "1.11"
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# --- ビルドプロファイル最適化設定 ---
# 開発・デバッグ実行時（cargo run）でも、GUI描画・グラフィックス・フォント等の外部依存クレートをフル最適化
# これにより、Debugビルド時のフレームレート低下と過剰CPU負荷を解消する
[profile.dev.package."*"]
opt-level = 3

# 自前クレートの開発ビルドも最低限の最適化（opt-level = 1）を適用して快適な動作を確保
[profile.dev]
opt-level = 1

# リリースビルドの最高速化設定
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
